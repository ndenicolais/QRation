plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

// Release signing: android/key.properties (git-ignored) points to the
// release keystore, kept outside the repo. Without it, release builds fall
// back to the debug key and print a warning.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.ndn21.qration"
    compileSdk = 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.ndn21.qration"
        minSdkVersion flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                logger.warn("WARNING: android/key.properties not found, signing the release build with the debug key.")
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Firebase (BoM) and Google Sign-In native libraries come from the
    // FlutterFire and google_sign_in plugins: don't pin versions here, or
    // they compete with the plugins' own (e.g. an old firebase-auth next to
    // Firebase BoM 34).
}

afterEvaluate {
    def packageReleaseTask = tasks.findByName("packageRelease")
    def writeReleaseMetadataTask = tasks.findByName("writeReleaseAppMetadata")
    if (packageReleaseTask != null && writeReleaseMetadataTask != null) {
        packageReleaseTask.dependsOn(writeReleaseMetadataTask)
    }
}
