plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

android {
    namespace = "com.ndn21.qration"
    compileSdk = 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.ndn21.qration"
        minSdkVersion flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Firebase (BoM) and Google Sign-In native libraries come from the
    // FlutterFire and google_sign_in plugins: don't pin versions here, or
    // they compete with the plugins' own (e.g. an old firebase-auth next to
    // Firebase BoM 34).
}

afterEvaluate {
    def packageReleaseTask = tasks.findByName("packageRelease")
    def writeReleaseMetadataTask = tasks.findByName("writeReleaseAppMetadata")
    if (packageReleaseTask != null && writeReleaseMetadataTask != null) {
        packageReleaseTask.dependsOn(writeReleaseMetadataTask)
    }
}
