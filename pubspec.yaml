name: qration
description: "A scanner and QR code creator."
publish_to: "none"
version: 2.0.0

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Navigation
  get: ^4.6.6

  # UI
  ming_cute_icons: ^0.0.7
  line_awesome_flutter: ^3.0.1
  smooth_page_indicator: ^1.2.0+3
  flutter_colorpicker: ^1.1.0
  toastification: ^2.3.0
  flutter_animate: ^4.5.0

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_crashlytics: ^5.4.0

  # Auth
  google_sign_in: ^7.2.0

  # QR Code
  mobile_scanner: ^7.4.0
  pretty_qr_code: ^3.6.0

  # Storage & Preferences
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # Permissions & Device
  permission_handler: ^11.3.1
  device_info_plus: ^11.2.0
  package_info_plus: ^9.0.1

  # Media
  image_picker: ^1.1.2
  image_gallery_saver_plus: ^4.0.1
  screenshot: ^3.0.0
  audioplayers: ^6.1.0
  vibration: ^3.1.3

  # Sharing & URLs
  share_plus: ^10.1.1
  url_launcher: ^6.3.1

  # Contact / Calendar
  country_code_picker: ^3.1.0
  flutter_contacts: ^1.1.9+2
  add_2_calendar: ^3.0.1

  # Network
  wifi_iot: ^0.3.19+2
  flutter_map: ^8.3.1
  latlong2: ^0.9.1

  # Export
  pdf: ^3.11.1
  excel: ^4.0.6
  csv: ^6.0.0
  file_picker: ^9.0.2

  # Localization
  intl: ^0.20.2

  # Logging
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.4.0
  flutter_launcher_icons: ^0.14.2
  dependency_validator: ^5.0.2
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/fonts/

  fonts:
    - family: QrationIcons
      fonts:
        - asset: assets/fonts/QrationIcons.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  min_sdk_android: 24
  image_path: "assets/images/app_icon_legacy.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  # The logo is single-color, so the transparent foreground doubles as the
  # Android 13+ themed (monochrome) icon.
  adaptive_icon_monochrome: "assets/images/app_icon_foreground.png"
